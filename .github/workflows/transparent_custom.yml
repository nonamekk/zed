name: Build zed-transparent-custom

# Every hour the plan job checks for a new stable Zed release; only then the build job applies
# this branch's own commits to it, builds the Arch package and publishes it: as a release of its
# own, and in the pacman repository kept as the assets of the `pacman-repo` release. Scheduled runs
# start only from the default branch, so zed-transparent-custom has to be the repository's default.

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [zed-transparent-custom]
  workflow_dispatch:
    inputs:
      tag:
        description: "Zed release tag to build (empty: the latest stable release)"
        required: false
        default: ""
      force:
        description: "Build even when a release for this tag and this branch head exists"
        type: boolean
        default: false

permissions:
  contents: read

# Explicit bash runs steps with pipefail, so a failing command before `| tee` fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: zed-transparent-custom
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository != 'zed-industries/zed'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Decide what to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          tag=${INPUT_TAG:-$(gh api repos/zed-industries/zed/releases/latest --jq .tag_name)}
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a stable Zed release tag: $tag"
            exit 1
          fi
          # The release name changes with the Zed tag and with this branch's head.
          id=$(printf '%s\n%s\n' "$tag" "$GITHUB_SHA" | sha256sum | cut -c1-8)
          release="zed-${tag#v}-transparent.$id"
          build=true
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$FORCE" = true ]; then
              release="$release-r$GITHUB_RUN_NUMBER"
            else
              build=false
            fi
          fi
          echo "Zed $tag, branch head $GITHUB_SHA, release $release, build $build"
          {
            echo "tag=$tag"
            echo "release=$release"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Apply this branch's commits to the release
        run: |
          curl -fsS -m 60 -o rebase.sh \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/transparent-custom/rebase.sh"
          bash rebase.sh "$TAG" "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA" src | tee commits.md

      - name: Write the PKGBUILD
        run: |
          mkdir -p pkg out target
          git -C src archive --format=tar.gz --prefix=zed/ -o "$PWD/pkg/zed.tar.gz" HEAD
          curl -fsS -m 60 -o pkg/PKGBUILD.arch \
            https://gitlab.archlinux.org/archlinux/packaging/packages/zed/-/raw/main/PKGBUILD
          python3 src/transparent-custom/pkgbuild.py pkg/PKGBUILD.arch pkg/PKGBUILD "${TAG#v}" 1.3

      - name: Build the package
        run: |
          docker run --rm \
            -v "$PWD/pkg:/pkg" -v "$PWD/out:/out" -v "$PWD/target:/target" \
            -v "$PWD/src/transparent-custom:/ci:ro" \
            archlinux:base-devel bash /ci/container-build.sh
          sudo chown -R "$(id -u):$(id -g)" out
          mv commits.md out/
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: out/
          retention-days: 7

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          {
            echo "Zed ${TAG#v} ([upstream release](https://github.com/zed-industries/zed/releases/tag/$TAG)) with these commits of \`zed-transparent-custom\` ($GITHUB_SHA):"
            echo
            cat dist/commits.md
            echo
            echo "Install through the pacman repository (see \`transparent-custom/README.md\`), or once: \`sudo pacman -U <package URL>\`."
          } > notes.md
          gh release create "$RELEASE" dist/*.pkg.tar.zst --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Zed ${TAG#v}, transparent custom" --notes-file notes.md

      - name: Update the pacman repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir repo
          cp dist/*.pkg.tar.zst repo/
          docker run --rm -v "$PWD/repo:/repo" archlinux:base \
            bash -c 'cd /repo && repo-add -q zed-transparent.db.tar.gz ./*.pkg.tar.zst'
          sudo chown -R "$(id -u):$(id -g)" repo
          # Release assets can't be symlinks, so the names pacman asks for are copies.
          cd repo
          rm zed-transparent.db zed-transparent.files
          cp zed-transparent.db.tar.gz zed-transparent.db
          cp zed-transparent.files.tar.gz zed-transparent.files
          if ! gh release view pacman-repo --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create pacman-repo --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "pacman repository" \
              --notes "pacman repository of zed-transparent-custom: Server = https://github.com/$GITHUB_REPOSITORY/releases/download/pacman-repo"
          fi
          stale=$(gh release view pacman-repo --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep '\.pkg\.tar\.zst$' | grep -vxF "$(basename -a ./*.pkg.tar.zst)" || true)
          # The package goes up before the database that lists it, and old packages go after.
          gh release upload pacman-repo ./*.pkg.tar.zst --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload pacman-repo zed-transparent.db zed-transparent.files \
            zed-transparent.db.tar.gz zed-transparent.files.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          for asset in $stale; do
            gh release delete-asset pacman-repo "$asset" --repo "$GITHUB_REPOSITORY" --yes
          done
